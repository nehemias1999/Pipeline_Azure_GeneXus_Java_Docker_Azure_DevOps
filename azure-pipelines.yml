# ==============================================================================
# azure-pipelines.yml — Pipeline multi-stage DEV/QA/PROD (REQ-01).
# Proposito: reemplaza a Pipeline_Script.yml (stage fantasma del legacy y
#   secretos hardcodeados); Build siempre verde,
#   Deploy_DEV automatico en main, Deploy_QA/PROD con environment + approval.
# Trigger: push a main y validacion PR contra main (solo Build en PR).
# Uso: corre automatico en Azure DevOps; manual con parametros
#   environment (DEV/QA/PROD) y version (default 1.0.$(Build.BuildId)).
# Nota: Azure Pipelines no admite la clave `permissions:` (sintaxis de
#   GitHub Actions); el token de build ya corre con alcance minimo por defecto.
# REQ-02 secretos: Key Vault (task AzureKeyVault@2 + variable group
#   Java_Application-Secrets linkeada); solo referencias $(Secreto), jamas
#   valores. Checkout via System.AccessToken (persistCredentials); prohibido
#   PAT en URL/CLI. Rotacion: rotar en Key Vault (la service connection
#   necesita Get/List); el pipeline falla si un secreto requerido esta vacio.
# Fuente task: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-key-vault-v2
# REQ-03 artefactos: Build publica el WAR como Universal Package
#   java-application-dev:$(appVersion) en $(artifactFeed) con .sha256 +
#   SBOM y tag Git v$(appVersion); los deploys descargan la version exacta.
# Fuente publish/download: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/universal-packages-v0
# REQ-06 observabilidad: Build publica el resumen de release (version,
#   commit, artefacto, SHA256, environment, aprobador) como artefacto
#   `release-summary` (JSON + Markdown) y el log cita version+SHA+tag.
#   Retencion: Azure DevOps no expone retencion por artefacto en YAML (se
#   configura en Project Settings > Pipelines > Retention); se declara aqui
#   la politica exigida (retention 30 dias) y el pipeline la documenta.
# Fuente variables predefinidas: https://learn.microsoft.com/en-us/azure/devops/pipelines/build/variables
# REQ-07 rollback: parametro rollbackVersion (default previous-stable) y
#   variable previousStableVersion (fuente determinista de la estable previa,
#   seteable en queue-time o via release-summary/tag); stages RollbackPreflight
#   (fail-fast pre-deploy) + Rollback manual que reusa templates/deploy.yml.
# ==============================================================================

trigger:
  branches:
    include:
      - main

# Validacion en PR: solo corre Build, ningun deploy ejecuta (ver conditions).
pr:
  branches:
    include:
      - main

parameters:
  - name: environment
    displayName: Entorno objetivo (runs manuales)
    type: string
    default: DEV
    values:
      - DEV
      - QA
      - PROD
  - name: version
    displayName: Version del artefacto
    type: string
    default: 1.0.$(Build.BuildId)
  # REQ-07: version objetivo del rollback (alias previous-stable o exacta).
  - name: rollbackVersion
    displayName: Version objetivo del rollback
    type: string
    default: previous-stable
  # REQ-02: nombres de vault/group por variable (defaults del change).
  - name: keyVaultName
    displayName: Nombre del Azure Key Vault
    type: string
    default: kv-java-app
  - name: vaultGroup
    displayName: Variable group linkeada al Key Vault
    type: string
    default: Java_Application-Secrets

variables:
  # Variable group linkeada a Key Vault (auditoria y rotacion fuera del repo).
  - group: ${{ parameters.vaultGroup }}
  - name: appVersion
    value: ${{ parameters.version }}
  # REQ-07: fuente determinista de la estable previa. `previous-stable` se
  #   resuelve a previousStableVersion si esta seteada (queue-time o variable
  #   group), sino al tag v* estable previo (segundo tag ordenado por version).
  - name: previousStableVersion
    value: ""
  - name: rollbackVersion
    value: ${{ parameters.rollbackVersion }}
  - name: artifactFeed
    value: java-app-artifacts
  - name: keyVaultName
    value: ${{ parameters.keyVaultName }}
  - name: keyVaultServiceConnection
    # Service connection ARM con Get/List sobre el vault; se crea una vez en
    # Project Settings (configuracion, no secreto).
    value: azure-keyvault-service-connection
  # REQ-06: politica de retencion declarada (dias) para artefactos de release.
  # Se aplica en Project Settings > Pipelines > Retention; el valor queda
  # versionado aqui como fuente de verdad auditable.
  - name: releaseRetentionDays
    value: 30

# Agente Windows con GeneXus 18U10 + MSBuild (demands evitan pool hardcodeado).
pool:
  name: Java_Application_agentpool
  demands:
    - msbuild # MSBuild de Visual Studio 2022 (build GeneXus/Java)
    - GeneXus_18U10 # GeneXus 18 Upgrade 10 instalado en el agente

stages:
  # Build: compila una vez y publica pipeline-metadata (version + commit).
  - stage: Build
    displayName: Build + validacion PR
    jobs:
      - job: BuildJob
        displayName: Compilar y publicar metadata
        timeoutInMinutes: 60
        steps:
          # Checkout con el token del build (System.AccessToken); prohibido
          # clonar con PAT en la URL o pasarlo por CLI.
          - checkout: self
            persistCredentials: true

          # REQ-02: descarga secretos desde Key Vault; quedan como variables
          # enmascaradas (***) en los logs.
          # Fuente: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-key-vault-v2
          - task: AzureKeyVault@2
            displayName: Descargar secretos de Key Vault
            inputs:
              azureSubscription: $(keyVaultServiceConnection)
              KeyVaultName: ${{ parameters.keyVaultName }}
              SecretsFilter: ServerPassword,ApplicationKey,SshPrivateKey,SshKnownHosts
              RunAsPreJob: true

          # Fail-fast: el pipeline FALLA si un secreto requerido esta vacio
          # (solo se nombran, nunca se imprimen valores).
          - task: Bash@3
            displayName: Validar secretos requeridos
            inputs:
              targetType: inline
              failOnStderr: true
              script: |
                missing=0
                if [ -z "$(ServerPassword)" ]; then
                  echo "secreto requerido vacio: ServerPassword" >&2
                  missing=1
                fi
                if [ -z "$(ApplicationKey)" ]; then
                  echo "secreto requerido vacio: ApplicationKey" >&2
                  missing=1
                fi
                if [ -z "$(SshPrivateKey)" ]; then
                  echo "secreto requerido vacio: SshPrivateKey" >&2
                  missing=1
                fi
                if [ -z "$(SshKnownHosts)" ]; then
                  echo "secreto requerido vacio: SshKnownHosts" >&2
                  missing=1
                fi
                if [ "$missing" -ne 0 ]; then exit 1; fi
                echo "secretos requeridos presentes (valores no mostrados)"

          - template: templates/build.yml
            parameters:
              version: $(appVersion)
              artifactFeed: $(artifactFeed)

          # Gate minimo de seguridad (stub; REQ-05 agrega Gitleaks/Trivy).
          - template: templates/security-scan.yml

          # Metadata del pipeline: version exacta + commit para trazabilidad.
          - task: Bash@3
            displayName: Generar pipeline-metadata
            inputs:
              targetType: inline
              failOnStderr: true
              script: |
                mkdir --parents pipeline-metadata
                printf 'version=%s\ncommit=%s\n' \
                  "$(appVersion)" "$(Build.SourceVersion)" \
                  > pipeline-metadata/version.txt
                cat pipeline-metadata/version.txt
          - task: PublishPipelineArtifact@1
            displayName: Publicar artefacto pipeline-metadata
            inputs:
              targetPath: pipeline-metadata
              artifactName: pipeline-metadata

          # REQ-06: resumen de release con los 6 campos de la spec (version,
          # commit, artefacto, SHA256, environment, aprobador). La identidad
          # del aprobador se resuelve en runtime ($(Build.RequestedFor));
          # los approvals de los environments QA/PROD quedan ademas en el
          # historial de checks de Azure DevOps. El SHA256 se lee del
          # .sha256 publicado por REQ-03 si existe en el workspace.
          # Fuente variables: https://learn.microsoft.com/en-us/azure/devops/pipelines/build/variables
          - task: Bash@3
            displayName: Generar resumen de release
            inputs:
              targetType: inline
              failOnStderr: true
              script: |
                mkdir --parents release-summary
                SHA_FILE="$(ls ./*.war.sha256 "$(Build.ArtifactStagingDirectory)"/*.war.sha256 2>/dev/null | head -n 1 || true)"
                if [ -n "$SHA_FILE" ]; then
                  SHA256="$(cut --delimiter=' ' --fields=1 "$SHA_FILE")"
                else
                  SHA256="lookup:$(artifactFeed)/java-application-dev:$(appVersion) (.sha256 publicado por REQ-03)"
                fi
                printf '{"version":"%s","commit":"%s","artifact":"%s:%s","sha256":"%s","environment":"%s","approver":"%s"}\n' \
                  "$(appVersion)" "$(Build.SourceVersion)" \
                  "java-application-dev" "$(appVersion)" \
                  "$SHA256" "${{ parameters.environment }}" \
                  "$(Build.RequestedFor)" \
                  > release-summary/release-summary.json
                printf '# Release %s\n\n- version: %s\n- commit: %s\n- artifact: java-application-dev:%s\n- sha256: %s\n- environment: %s\n- approver: %s\n- tag: v%s\n' \
                  "$(appVersion)" "$(appVersion)" "$(Build.SourceVersion)" \
                  "$(appVersion)" "$SHA256" "${{ parameters.environment }}" \
                  "$(Build.RequestedFor)" "$(appVersion)" \
                  > release-summary/release-summary.md
                echo "release v$(appVersion) SHA256:$SHA256 tag:v$(appVersion) environment:${{ parameters.environment }}"
          - task: PublishPipelineArtifact@1
            displayName: Publicar artefacto release-summary
            inputs:
              targetPath: release-summary
              artifactName: release-summary

  # Deploy_DEV: automatico solo en push a main, nunca en PR.
  - stage: Deploy_DEV
    displayName: Deploy a DEV
    dependsOn: Build
    condition: >-
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: DEV
          version: $(appVersion)
          artifactFeed: $(artifactFeed)

  # Deploy_QA: requiere approval del environment QA en Azure DevOps.
  - stage: Deploy_QA
    displayName: Deploy a QA
    dependsOn: Deploy_DEV
    condition: >-
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: QA
          version: $(appVersion)
          artifactFeed: $(artifactFeed)

  # Deploy_PROD: requiere approval del environment PROD en Azure DevOps.
  - stage: Deploy_PROD
    displayName: Deploy a PROD
    dependsOn: Deploy_QA
    condition: >-
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: PROD
          version: $(appVersion)
          artifactFeed: $(artifactFeed)

  # RollbackPreflight: fail-fast pre-deploy del rollback (REQ-07). Resuelve
  # `previous-stable` de forma determinista (variable previousStableVersion,
  # fallback al tag v* estable previo) y verifica que la version exista en el
  # feed ANTES de tocar el servidor; si no existe, falla listando las
  # versiones disponibles con el servidor intacto. Manual: nunca en PR/auto.
  - stage: RollbackPreflight
    displayName: Preflight rollback (fail-fast)
    condition: >-
      and(succeeded(),
          eq(variables['Build.Reason'], 'Manual'),
          ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: ResolveVersion
        displayName: Resolver version y fail-fast si no existe
        timeoutInMinutes: 10
        steps:
          - task: Bash@3
            displayName: Resolver previous-stable y validar en feed
            # Nombre requerido: el stage Rollback consume esta variable via
            # stageDependencies (ver MS Learn "Use outputs in a different
            # stage"); sin isOutput=true llegaria vacia al stage siguiente.
            name: SetResolvedVersion
            inputs:
              targetType: inline
              failOnStderr: true
              script: |
                ROLLBACK_VERSION="$(rollbackVersion)"
                if [ "$ROLLBACK_VERSION" = "previous-stable" ]; then
                  if [ -n "$(previousStableVersion)" ]; then
                    ROLLBACK_VERSION="$(previousStableVersion)"
                  else
                    ROLLBACK_VERSION="$(git tag --list 'v*' --sort=-v:refname | sed -n '2p' | sed 's/^v//')"
                  fi
                  echo "previous-stable resuelto a: $ROLLBACK_VERSION"
                fi
                if [ -z "$ROLLBACK_VERSION" ]; then
                  echo "version de rollback vacia" >&2
                  exit 1
                fi
                echo "##vso[task.setvariable variable=resolvedRollbackVersion;isOutput=true]$ROLLBACK_VERSION"
                if command -v az >/dev/null 2>&1; then
                  if ! az artifacts universal show --feed "$(artifactFeed)" --name java-application-dev --version "$ROLLBACK_VERSION" >/dev/null 2>&1; then
                    echo "version inexistente: $ROLLBACK_VERSION (fail-fast pre-deploy, servidor intacto)" >&2
                    echo "versiones disponibles:" >&2
                    az artifacts universal list --feed "$(artifactFeed)" --name java-application-dev --query "[].version" >&2 || true
                    exit 1
                  fi
                  echo "version $ROLLBACK_VERSION existe en $(artifactFeed)"
                else
                  echo "az CLI ausente: validacion contra feed omitida (skip explicito); la descarga exacta falla cerrado si la version no existe"
                fi

  # Rollback: stage MANUAL (REQ-07). Nunca corre en PR/auto (Build.Reason
  #   Manual + exclusion PullRequest). Reusa el flujo endurecido de REQ-04
  #   (templates/deploy.yml: checksum, backup, healthcheck, restore) contra
  #   PROD con el artefacto EXACTO resuelto en el preflight; el healthcheck
  #   del flujo endurecido debe dar 200 antes de la anotacion de cierre.
  - stage: Rollback
    displayName: Rollback manual a previous-stable
    dependsOn: RollbackPreflight
    condition: >-
      and(succeeded(),
          eq(variables['Build.Reason'], 'Manual'),
          ne(variables['Build.Reason'], 'PullRequest'))
    # Cableado cross-stage: la version resuelta en RollbackPreflight solo
    # cruza como output variable (isOutput=true); se mapea aqui a nivel de
    # stage para que ambos jobs (deploy endurecido + anotacion) la vean como
    # $(resolvedRollbackVersion). Fuente: MS Learn "Use outputs in a
    # different stage" (stageDependencies.STAGE.JOB.outputs['STEP.VAR']).
    variables:
      resolvedRollbackVersion: $[ stageDependencies.RollbackPreflight.ResolveVersion.outputs['SetResolvedVersion.resolvedRollbackVersion'] ]
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: PROD
          version: $(resolvedRollbackVersion)
          artifactFeed: $(artifactFeed)
      # Anotacion de cierre: solo corre tras el deploy endurecido (healthcheck
      #   200 verificado) y registra el evento como rollback con timestamp UTC
      #   e identidad del aprobador en runtime (nunca hardcodeada).
      - job: AnnotateRollback
        displayName: Anotar rollback (timestamp + identidad)
        dependsOn: Deploy
        timeoutInMinutes: 10
        steps:
          - task: Bash@3
            displayName: Anotar rollback verificado
            inputs:
              targetType: inline
              failOnStderr: true
              script: |
                TIMESTAMP="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
                mkdir --parents rollback-annotation
                printf '{"type":"rollback","environment":"PROD","version":"%s","timestamp":"%s","approver":"%s","healthcheck":"200"}\n' \
                  "$(resolvedRollbackVersion)" "$TIMESTAMP" "$(Build.RequestedFor)" \
                  > rollback-annotation/annotation.json
                cat rollback-annotation/annotation.json
                echo "rollback PROD a $(resolvedRollbackVersion) verificado (healthcheck 200) por $(Build.RequestedFor) en $TIMESTAMP"
          - task: PublishPipelineArtifact@1
            displayName: Publicar anotacion de rollback
            inputs:
              targetPath: rollback-annotation
              artifactName: rollback-annotation
