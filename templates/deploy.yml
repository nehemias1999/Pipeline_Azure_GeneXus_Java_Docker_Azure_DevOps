# ==============================================================================
# templates/deploy.yml — Deploy parametrizado por entorno (REQ-01).
# Proposito: desplegar el artefacto exacto segun environment/version sin
#   duplicar YAML por entorno; QA/PROD esperan approval del environment.
# Uso: jobs -> template con parameters { environment, version, artifactFeed,
#   sshTarget }. sshTarget (usuario@host) es opcional: si esta vacio, el
#   chequeo SSH se omite y REQ-04 provee el host real sin cambiar la interfaz.
# REQ-02 secretos: AzureKeyVault@2 por job (los deployments no heredan
#   variables de Build) + fail-fast si un secreto esta vacio. SSH con llave
#   desde $(SshPrivateKey) (nunca en repo), StrictHostKeyChecking=yes con
#   .ssh/known_hosts versionado, BatchMode=yes y ConnectTimeout; la llave se
#   borra del agente al terminar (paso always). Clonado solo via
#   System.AccessToken; prohibido PAT en URL/CLI.
#   Falla si algun parametro esta vacio. La descarga del artefacto por
#   version exacta con verificacion SHA (REQ-03) vive aqui; el deploy
#   endurecido con healthcheck/rollback (REQ-04) invoca
#   scripts/deploy-docker-tomcat.sh (Linux) o .ps1 (Windows via pwsh)
#   con la version exacta, sin cambiar la interfaz.
# REQ-04 HealthUrl por entorno: el parametro `healthUrl` tiene prioridad; si
#   viene vacio se resuelve la variable `healthUrl_<ENV>` (p.ej. healthUrl_DEV
#   del Variable Group del entorno, visible como HEALTHURL_<ENV> en el agente)
#   y como ultimo default el script usa http://localhost:8080/ (documentado en
#   la cabecera de cada script). El flujo nuevo nunca referencia el directorio
#   legacy de scripts Windows (ver README.legacy.md de dicho directorio).
# REQ-03 artefactos: descarga el Universal Package java-application-dev
#   por version EXACTA y verifica sha256sum -c antes de cualquier copia;
#   ante mismatch el pipeline falla cerrado. Queda prohibido resolver
#   el flotante `latest`: el escenario "Verificacion de integridad" exige
#   el artefacto exacto que publico Build.
#   Fuente: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/universal-packages-v0
# ==============================================================================

parameters:
  - name: environment
    type: string
    default: ""
  - name: version
    type: string
    default: ""
  - name: artifactFeed
    type: string
    default: ""
  - name: sshTarget
    type: string
    default: ""
  - name: healthUrl
    type: string
    default: ""

jobs:
  - deployment: Deploy
    displayName: Desplegar version parametrizada
    timeoutInMinutes: 30
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            # REQ-02: los jobs de deploy no heredan variables de Build, por
            # eso se descargan aqui los secretos (enmascarados *** en logs).
            # Fuente: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/azure-key-vault-v2
            - task: AzureKeyVault@2
              displayName: Descargar secretos de Key Vault
              inputs:
                azureSubscription: $(keyVaultServiceConnection)
                KeyVaultName: $(keyVaultName)
                SecretsFilter: ServerPassword,ApplicationKey,SshPrivateKey,SshKnownHosts
                RunAsPreJob: true

            # Fail-fast: sin secretos no hay deploy (nombres solo, sin valores).
            - task: Bash@3
              displayName: Validar secretos requeridos
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  missing=0
                  if [ -z "$(ServerPassword)" ]; then
                    echo "secreto requerido vacio: ServerPassword" >&2
                    missing=1
                  fi
                  if [ -z "$(ApplicationKey)" ]; then
                    echo "secreto requerido vacio: ApplicationKey" >&2
                    missing=1
                  fi
                  if [ -z "$(SshPrivateKey)" ]; then
                    echo "secreto requerido vacio: SshPrivateKey" >&2
                    missing=1
                  fi
                  if [ -z "$(SshKnownHosts)" ]; then
                    echo "secreto requerido vacio: SshKnownHosts" >&2
                    missing=1
                  fi
                  if [ "$missing" -ne 0 ]; then exit 1; fi
                  echo "secretos requeridos presentes (valores no mostrados)"
            # Valida parametros: sin environment/version/feed no hay deploy.
            - task: Bash@3
              displayName: Validar parametros de deploy
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  if [ -z "${{ parameters.environment }}" ]; then
                    echo "environment vacio" >&2
                    exit 1
                  fi
                  if [ -z "${{ parameters.version }}" ]; then
                    echo "version vacia" >&2
                    exit 1
                  fi
                  if [ -z "${{ parameters.artifactFeed }}" ]; then
                    echo "artifactFeed vacio" >&2
                    exit 1
                  fi
                  echo "Deploy ${{ parameters.version }} a" \
                    "${{ parameters.environment }} desde" \
                    "${{ parameters.artifactFeed }}"

            # SSH endurecido: llave desde Key Vault (nunca en repo) y host
            # verificado contra .ssh/known_hosts versionado. Si el fingerprint
            # cambia, SSH falla cerrado (escenario MITM de la spec).
            - task: Bash@3
              displayName: Configurar SSH endurecido
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  mkdir --parents ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s' "$(SshPrivateKey)" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  cp .ssh/known_hosts ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts
                  ssh-keygen -l -f ~/.ssh/known_hosts
                  echo "SSH configurado (llave desde Key Vault, host verificado)"

            # Chequeo de conectividad con host verificado; se omite si el
            # template se invoca sin sshTarget (REQ-04 provee el host real).
            - task: Bash@3
              displayName: Verificar conexion SSH
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  if [ -z "${{ parameters.sshTarget }}" ]; then
                    echo "sshTarget vacio: chequeo SSH omitido"
                    exit 0
                  fi
                  ssh -i ~/.ssh/id_deploy \
                    -o StrictHostKeyChecking=yes \
                    -o BatchMode=yes \
                    -o ConnectTimeout=10 \
                    "${{ parameters.sshTarget }}" true

            # REQ-03: descarga el Universal Package por version EXACTA desde
            # el feed interno. vstsPackageVersion nunca usa comodines ni
            # latest: el escenario "Verificacion de integridad" exige el
            # artefacto exacto que publico Build.
            # Fuente: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/universal-packages-v0
            - task: UniversalPackages@0
              displayName: Descargar artefacto versionado
              inputs:
                command: download
                downloadDirectory: $(System.DefaultWorkingDirectory)/artifact
                feedsToUse: internal
                vstsFeed: ${{ parameters.artifactFeed }}
                vstsFeedPackage: java-application-dev
                vstsPackageVersion: ${{ parameters.version }}

            # REQ-03: verifica el SHA256 publicado ANTES de cualquier copia.
            # sha256sum -c sale !=0 ante mismatch y la tarea (failOnStderr)
            # falla el deploy sin tocar el servidor.
            - task: Bash@3
              displayName: Verificar SHA256 antes de copiar
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  cd "$(System.DefaultWorkingDirectory)/artifact"
                  sha256sum -c ./*.war.sha256
                  echo "SHA256 OK: version ${{ parameters.version }} integra desde ${{ parameters.artifactFeed }}"

            # REQ-04: deploy endurecido via script versionado con la version
            # EXACTA descargada de Artifacts. Resuelve HealthUrl por entorno:
            # param `healthUrl` > variable `healthUrl_<ENV>` > default del
            # script. Sin sshTarget no hay servidor al cual desplegar: se omite
            # (el chequeo SSH de arriba ya documento la omision).
            - task: Bash@3
              displayName: Desplegar en Tomcat via script (Linux)
              condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'), ne('${{ parameters.sshTarget }}', ''))
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  WAR_PATH="$(echo "$(System.DefaultWorkingDirectory)/artifact"/*.war)"
                  HEALTH_URL_RESOLVED="${{ parameters.healthUrl }}"
                  if [ -z "$HEALTH_URL_RESOLVED" ]; then
                    ENV_NAME="$(echo "healthUrl_${{ parameters.environment }}" | tr '[:lower:]' '[:upper:]')"
                    HEALTH_URL_RESOLVED="${!ENV_NAME:-}"
                  fi
                  bash scripts/deploy-docker-tomcat.sh \
                    --war-path "$WAR_PATH" \
                    --version "${{ parameters.version }}" \
                    --ssh-target "${{ parameters.sshTarget }}" \
                    --health-url "$HEALTH_URL_RESOLVED"

            # REQ-04 gemelo Windows: mismo script en .ps1 via pwsh, misma
            # version exacta y misma resolucion healthUrl_<ENV>.
            - task: PowerShell@2
              displayName: Desplegar en Tomcat via script (Windows)
              condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'), ne('${{ parameters.sshTarget }}', ''))
              inputs:
                targetType: inline
                pwsh: true
                failOnStderr: true
                script: |
                  $war = Get-ChildItem "$(System.DefaultWorkingDirectory)/artifact/*.war" | Select-Object -First 1
                  $healthUrl = "${{ parameters.healthUrl }}"
                  if ([string]::IsNullOrEmpty($healthUrl)) {
                    $healthUrl = [Environment]::GetEnvironmentVariable("HEALTHURL_${{ parameters.environment }}")
                  }
                  ./scripts/deploy-docker-tomcat.ps1 -WarPath $war.FullName -Version "${{ parameters.version }}" -SshTarget "${{ parameters.sshTarget }}" -HealthUrl $healthUrl

            # Higiene: la llave privada nunca queda en el agente.
            - task: Bash@3
              displayName: Limpiar llave SSH del agente
              condition: always()
              inputs:
                targetType: inline
                failOnStderr: true
                script: |
                  rm --force ~/.ssh/id_deploy
                  echo "llave SSH eliminada del agente"
